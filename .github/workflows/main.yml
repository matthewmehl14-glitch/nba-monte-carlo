name: Manual Projections Update

on:
  workflow_dispatch: # This allows manual trigger ONLY. No schedule.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the JSON file back to the repository
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests numpy pandas nba_api

      - name: Run Monte Carlo Engine
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python generate_projections.py

      - name: Commit Projections
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add projections.json
          git commit -m "Manual EV update" || echo "No changes to commit"
          git push
