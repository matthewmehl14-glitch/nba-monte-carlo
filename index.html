<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA +EV Projections</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-2">NBA Monte Carlo Projections</h1>
        <p class="text-sm text-gray-400 mb-6">10,000 Iterations based on Four Factors. Benchmarked against Pinnacle.</p>
        
        <div id="projections-container" class="space-y-4">
            <!-- Game cards injected here -->
        </div>
    </div>

    <script>
        async function loadProjections() {
            try {
                // Fetch the JSON file generated by GitHub Actions
                const response = await fetch('projections.json');
                const data = await response.json();
                const container = document.getElementById('projections-container');

                data.forEach(game => {
                    const isEvPositive = game.edge > 0;
                    const edgeColor = isEvPositive ? 'text-green-400' : 'text-red-400';
                    const borderGlow = isEvPositive && game.edge > 4.0 ? 'border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.3)]' : 'border-gray-700';

                    container.innerHTML += `
                        <div class="bg-gray-800 border ${borderGlow} rounded-lg p-5">
                            <div class="flex justify-between items-center mb-3">
                                <h2 class="text-xl font-semibold">${game.away_team} @ ${game.home_team}</h2>
                                <span class="text-sm text-gray-400">Pinnacle Fair: ${game.true_prob.toFixed(1)}%</span>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-gray-900 p-3 rounded">
                                    <p class="text-sm text-gray-400">Target Sportsbook (${game.bookmaker})</p>
                                    <p class="text-lg">${game.market}: ${game.odds}</p>
                                </div>
                                <div class="bg-gray-900 p-3 rounded text-right">
                                    <p class="text-sm text-gray-400">Model EV</p>
                                    <p class="text-lg font-bold ${edgeColor}">${game.edge.toFixed(2)}%</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error loading projections:", error);
            }
        }
        loadProjections();
    </script>
</body>
</html>
