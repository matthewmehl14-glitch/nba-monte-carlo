<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Monte Carlo Projections</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-3xl font-bold">NBA Monte Carlo System</h1>
                <p class="text-sm text-gray-400">10k Iterations | Pinnacle Benchmark | $25 Flat Unit</p>
            </div>
            <!-- Tab Switcher -->
            <div class="flex bg-gray-800 rounded-lg p-1 border border-gray-700">
                <button id="tab-live" onclick="showTab('live')" class="px-4 py-1.5 rounded-md text-sm font-semibold bg-blue-600 text-white">Live Projections</button>
                <button id="tab-backtest" onclick="showTab('backtest')" class="px-4 py-1.5 rounded-md text-sm font-semibold text-gray-400 hover:text-white">Backtest</button>
            </div>
        </div>

        <!-- 1. LIVE PROJECTIONS VIEW -->
        <div id="view-live" class="space-y-4">
            <div id="live-container" class="space-y-4">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- 2. BACKTEST VIEW -->
        <div id="view-backtest" class="hidden space-y-6">
            <div id="backtest-summary" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Summary cards injected via JS -->
            </div>

            <div class="bg-gray-800 rounded-lg border border-gray-700 p-5">
                <h2 class="text-xl font-bold mb-4">EV% Bucket Performance</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-gray-300">
                        <thead class="bg-gray-900 text-gray-400 uppercase text-xs">
                            <tr>
                                <th class="p-3">EV Range</th>
                                <th class="p-3">Bets</th>
                                <th class="p-3">Win Rate</th>
                                <th class="p-3">Net Profit ($25)</th>
                                <th class="p-3">ROI</th>
                            </tr>
                        </thead>
                        <tbody id="bucket-table-body" class="divide-y divide-gray-700">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tab) {
            if (tab === 'live') {
                document.getElementById('view-live').classList.remove('hidden');
                document.getElementById('view-backtest').classList.add('hidden');
                document.getElementById('tab-live').className = 'px-4 py-1.5 rounded-md text-sm font-semibold bg-blue-600 text-white';
                document.getElementById('tab-backtest').className = 'px-4 py-1.5 rounded-md text-sm font-semibold text-gray-400 hover:text-white';
            } else {
                document.getElementById('view-live').classList.add('hidden');
                document.getElementById('view-backtest').classList.remove('hidden');
                document.getElementById('tab-backtest').className = 'px-4 py-1.5 rounded-md text-sm font-semibold bg-blue-600 text-white';
                document.getElementById('tab-live').className = 'px-4 py-1.5 rounded-md text-sm font-semibold text-gray-400 hover:text-white';
            }
        }

        async function loadData() {
            // Load Live Projections
            try {
                const res = await fetch('projections.json');
                const data = await res.json();
                const container = document.getElementById('live-container');

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="bg-gray-800 border border-gray-700 rounded-lg p-8 text-center text-gray-400">
                            <p class="text-lg font-medium text-gray-300">No +EV edges found right now</p>
                            <p class="text-sm mt-1">If it's the offseason or early morning, lines have not been posted by bookmakers yet.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = '';
                    data.forEach(game => {
                        const edgeColor = game.edge > 0 ? 'text-green-400' : 'text-red-400';
                        container.innerHTML += `
                            <div class="bg-gray-800 border border-gray-700 rounded-lg p-5">
                                <div class="flex justify-between items-center mb-2">
                                    <h2 class="text-xl font-bold">${game.away_team} @ ${game.home_team}</h2>
                                    <span class="text-sm text-gray-400">Pinnacle Fair: ${game.true_prob.toFixed(1)}%</span>
                                </div>
                                <div class="grid grid-cols-2 gap-4 mt-3">
                                    <div class="bg-gray-900 p-3 rounded">
                                        <p class="text-xs text-gray-400">Bookmaker (${game.bookmaker})</p>
                                        <p class="text-base font-semibold">${game.market} @ ${game.odds > 0 ? '+' : ''}${game.odds}</p>
                                    </div>
                                    <div class="bg-gray-900 p-3 rounded text-right">
                                        <p class="text-xs text-gray-400">Model Expected Edge</p>
                                        <p class="text-base font-bold ${edgeColor}">+${game.edge.toFixed(2)}%</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.error("Projections load error:", err);
            }

            // Load Backtest Results if file exists
            try {
                const bRes = await fetch('backtest_results.json');
                if (bRes.ok) {
                    const bData = await bRes.json();
                    
                    document.getElementById('backtest-summary').innerHTML = `
                        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                            <p class="text-xs text-gray-400">Total Wagers</p>
                            <p class="text-2xl font-bold">${bData.total_bets}</p>
                        </div>
                        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                            <p class="text-xs text-gray-400">Total Risked ($25/bet)</p>
                            <p class="text-2xl font-bold">$${bData.total_wagered.toLocaleString()}</p>
                        </div>
                        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                            <p class="text-xs text-gray-400">Net Profit</p>
                            <p class="text-2xl font-bold ${bData.net_profit >= 0 ? 'text-green-400' : 'text-red-400'}">$${bData.net_profit.toFixed(2)}</p>
                        </div>
                        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                            <p class="text-xs text-gray-400">Total ROI</p>
                            <p class="text-2xl font-bold ${bData.roi >= 0 ? 'text-green-400' : 'text-red-400'}">${bData.roi.toFixed(2)}%</p>
                        </div>
                    `;

                    const tableBody = document.getElementById('bucket-table-body');
                    tableBody.innerHTML = '';
                    bData.buckets.forEach(b => {
                        tableBody.innerHTML += `
                            <tr>
                                <td class="p-3 font-medium">${b.range}</td>
                                <td class="p-3">${b.bets}</td>
                                <td class="p-3">${b.win_rate}</td>
                                <td class="p-3 font-semibold ${b.profit >= 0 ? 'text-green-400' : 'text-red-400'}">$${b.profit.toFixed(2)}</td>
                                <td class="p-3 font-semibold ${b.roi >= 0 ? 'text-green-400' : 'text-red-400'}">${b.roi.toFixed(2)}%</td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.log("No backtest_results.json found yet.");
            }
        }

        loadData();
    </script>
</body>
</html>
